apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-management-deployment
  labels:
    app: my-app
spec:
  replicas: 5

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
        - name: case-management-app
          image: luvuyotafeni012/case-management-app:9e83496d3b5c0437885a15e4d75d75e5f5e9ca03
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: case-management-config

            - secretRef:
                name: case-management-secret