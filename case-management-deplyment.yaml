apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-management-deployment
  labels:
    app: my-app
spec:
  replicas: 5

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
        - name: case-management-app
          image: luvuyotafeni012/case-management-app:2995cf01bae94fd4cf92675064bc1285f42f9f10
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: case-management-config

            - secretRef:
                name: case-management-secret