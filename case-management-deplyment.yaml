apiVersion: apps/v1
kind: Deployment
metadata:
  name: case-management-deployment
  labels:
    app: my-app
spec:
  replicas: 5

  selector:
    matchLabels:
      app: my-app

  template:
    metadata:
      labels:
        app: my-app

    spec:
      containers:
        - name: case-management-app
          image: luvuyotafeni012/case-management-app:599dde2eabfdc3c784ec70810e0827a653024ac6
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: case-management-config

            - secretRef:
                name: case-management-secret