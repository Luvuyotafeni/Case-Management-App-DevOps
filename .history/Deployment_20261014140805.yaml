apiVersion: app/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: case-management-app
        image: luvuyotafeni012/case-management-app:latest
        ports:
        - containerPort: 8080