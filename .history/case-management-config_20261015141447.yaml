apiVersion: v1
kind: ConfigMap
metadata:
  name: case-management-config
data:
  SPRING_APPLICATION_NAME: "CaseManagement"

  DB_HOST: "db-service"
  DB_PORT: "3306"
  DB_NAME: "casemanagement"

  HIBERNATE_DIALECT: "org.hibernate.dialect.MySQLDialect"
  HIBERNATE_DDL_AUTO: "update"

  JWT_EXPIRATION: "432000"

  IMAGEKIT_URL_ENDPOINT: "https://ik.imagekit.io/od4sntfndg"

  MULTIPART_MAX_FILE_SIZE: "10MB"
  MULTIPART_MAX_REQUEST_SIZE: "10MB"

  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_SMTP_AUTH: "true"
  MAIL_SMTP_STARTTLS_ENABLE: "true"