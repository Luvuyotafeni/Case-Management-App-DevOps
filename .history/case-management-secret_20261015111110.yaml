apiVersion: v1
kind: Secret
metadata:
  name: case-management-secret
type: Opaque
stringData:

  # Database
  DB_USERNAME: "root"
  DB_PASSWORD: "1234"

  # JWT
  JWT_SECRET: "YOUR_NEW_JWT_SECRET"

  # ImageKit
  IMAGEKIT_PUBLIC_KEY: "YOUR_IMAGEKIT_PUBLIC_KEY"
  IMAGEKIT_PRIVATE_KEY: "YOUR_NEW_IMAGEKIT_PRIVATE_KEY"

  # Gmail
  MAIL_USERNAME: "your-email@gmail.com"
  MAIL_PASSWORD: "YOUR_NEW_GMAIL_APP_PASSWORD"